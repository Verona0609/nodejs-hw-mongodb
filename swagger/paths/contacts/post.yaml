tags:
  - Contacts
summary: Create a contact
operationId: createStudent
description: 'Create a contact with payload'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - email
          - userId
          - photo
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'Maria Zavodzova'
          phoneNumber:
            description: "Contact's phone number"
            type: string
            example: '+380960615310'
          email:
            description: "Contact's email"
            type: string
            example: 'zavodzova@gmail.com'
          isFavorite:
            description: 'Indicates if the contact is marked as favorite'
            type: boolean
            example: true
            default: true
          contactType:
            description: "Contact's type"
            type: string
            enum: ['work', 'home', 'personal']
            example: 'work'
            default: 'personal'
          userId:
            description: "Contact's userId"
            type: string
            example: '672a2f64e582207d37e026e8'
          photo:
            description: "Contact's photo URL"
            type: string
            format: binary
responses:
  '201':
    description: Create a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact!
            data:
              type: object
              $ref: '../../components/schemas/contact.yaml'
  '401':
    $ref: ../../components/responses/401.yaml
